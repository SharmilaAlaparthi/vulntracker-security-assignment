{{- if .Values.externalSecrets.enabled -}}
# Syncs secrets from the configured secrets manager into a Kubernetes Secret.
# Requires the External Secrets Operator (external-secrets.io) in the cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "vulntracker.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.secretKey | quote }}
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.databaseUrl | quote }}
{{- end -}}
