apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vulntracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vulntracker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vulntracker.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: NOTIFY_SERVICE_URL
              value: {{ .Values.config.notifyServiceUrl | quote }}
            - name: SHARE_BASE_URL
              value: {{ .Values.config.shareBaseUrl | quote }}
            - name: SHARE_LINK_TTL_HOURS
              value: {{ .Values.config.shareLinkTtlHours | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.config.accessTokenExpireMinutes | quote }}
            - name: JWT_ALGORITHM
              value: {{ .Values.config.jwtAlgorithm | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsAllowedOrigins | quote }}
            # Secrets are injected from the synced Kubernetes Secret, which is
            # populated from the external secrets manager — never hardcoded.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulntracker.secretName" . }}
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulntracker.secretName" . }}
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem requires writable tmp for any scratch use.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
